# NZD instrument universe. Equities/index are REAL (subscribed live via ib_async) --
# symbols/exchanges below are best-effort defaults; verify with ib.qualifyContractsAsync() or
# TWS contract search and correct if IBKR resolves them differently. NZX-listed names may have
# limited/no IBKR market data entitlement -- treat this file as the one most likely to need
# manual correction in Phase E.
#
# Checked 2026-09-27 against this account's paper connection: NZ50/NZ50G (NZX, NZE), FPH and ATM
# (NZX) all came back with zero matches from both qualifyContractsAsync and reqMatchingSymbols --
# not just a wrong exchange code, IBKR's contract search has nothing under these symbols at all
