[project]
name = "ibkr-dashboard"
version = "0.1.0"
description = "Live G10 rates/equity RV dashboard on top of Interactive Brokers"
authors = [{ name = "Ryuzaki" }]
requires-python = ">=3.11,<3.13"
readme = "README.md"

dependencies = [
  "ib_async>=1.0.3,<2.0.0",
  "dash>=2.17,<3.0",
  "dash-extensions>=1.0.14,<2.0.0",
  "plotly>=5.22,<6.0",
  "pandas>=2.2,<3.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "pyyaml>=6.0,<7.0",
  "python-dotenv>=1.0,<2.0",
  "websockets>=12.0,<13.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2,<9",
  "ruff>=0.5,<0.6",
]

[project.scripts]
dashboard = "ibkr_dashboard.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ibkr_dashboard"]

[tool.ruff]
line-length = 100
